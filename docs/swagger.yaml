host: localhost:8082
info:
  contact: {}
  description: 堆栈人生博客系统 - 前台公开 API，供 Web 前端和微信小程序使用
  title: 堆栈人生 Frontend API
  version: "1.0"
paths:
  /articles:
    get:
      description: 获取已发布文章列表，支持分页和按分类/目录/标签过滤
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 分类ID
        in: query
        name: cid
        type: integer
      - description: 目录ID
        in: query
        name: did
        type: integer
      - description: 标签ID
        in: query
        name: tid
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/frontend.ArticleListResponse'
      summary: 文章列表
      tags:
      - Frontend API
  /articles/{id}:
    get:
      description: 获取单篇文章详情，包含分类、目录和标签信息
      parameters:
      - description: 文章ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/frontend.ArticleDetailResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: 文章详情
      tags:
      - Frontend API
  /categories:
    get:
      description: 获取所有启用的文章分类
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/frontend.CategoryListResponse'
      summary: 分类列表
      tags:
      - Frontend API
  /directories:
    get:
      description: 获取所有启用的文章目录
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/frontend.DirectoryListResponse'
      summary: 目录列表
      tags:
      - Frontend API
  /messages:
    get:
      description: 获取留言记录（分页）
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/frontend.MessageListResponse'
      summary: 留言列表
      tags:
      - Frontend API
    post:
      consumes:
      - application/json
      description: 提交一条新留言，邮箱和内容为必填
      parameters:
      - description: 留言内容 {name, email, url, content}
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/frontend.MessageListResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: 提交留言
      tags:
      - Frontend API
  /tags:
    get:
      description: 获取所有启用的文章标签
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/frontend.TagListResponse'
      summary: 标签列表
      tags:
      - Frontend API
  /website:
    get:
      description: 获取前端可见的网站配置信息（is_to_frontend=1 的键值对，如站点名称、CDN地址等）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/frontend.WebsiteResponse'
      summary: 网站设置
      tags:
      - Frontend API
swagger: "2.0"
